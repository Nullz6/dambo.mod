workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install Theos
        script: |
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
      - name: Compile Dylib
        script: |
          export THEOS=/tmp/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1
      - name: Zip Dylib
        script: |
          find .theos/obj -name "*.dylib" -exec cp {} ./DAMBO.dylib \;
          zip -r DAMBO_dylib.zip DAMBO.dylib
    artifacts:
      - DAMBO_dylib.zip
