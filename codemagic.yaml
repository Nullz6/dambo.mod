workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install Theos
        script: |
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
      - name: Compile Dylib
        script: |
          export THEOS=/tmp/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make
      - name: Download, Inject, and Package
        script: |
          export THEOS=/tmp/theos
          export PATH=$THEOS/bin:$PATH
          
          curl -L -o base.ipa "https://files.catbox.moe/ue56uv.ipa"
          
          DYLib=$(find .theos/obj -name "DAMBO.dylib" | head -1)
          
          mkdir -p extracted_ipa
          unzip -o base.ipa -d extracted_ipa
          
          APP_PATH=$(find extracted_ipa/Payload -name "*.app" | head -1)
          EXEC_NAME=$(defaults read "$APP_PATH/Info" CFBundleExecutable)
          EXEC_PATH="$APP_PATH/$EXEC_NAME"
          
          # Inject
          cp "$DYLib" "$APP_PATH/DAMBO.dylib"
          $THEOS/bin/optool install -c load -p "@executable_path/DAMBO.dylib" -t "$EXEC_PATH"
          
          # SIGN THE MAIN EXECUTABLE AND THE NEW DYLIBS
          ldid -S "$EXEC_PATH"
          ldid -S "$APP_PATH/DAMBO.dylib"
          
          cd extracted_ipa
          zip -r ../DAMBO_Final.zip Payload
    artifacts:
      - DAMBO_Final.zip